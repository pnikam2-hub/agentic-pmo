<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agentic PMO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <!-- App Shell -->
  <div id="app">
    <aside id="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <span class="logo-icon">◆</span>
          <span class="logo-text">Agentic PMO</span>
        </div>
        <span class="version-badge">v0.1</span>
      </div>
      <nav class="sidebar-nav">
        <a class="nav-item active" data-view="dashboard" href="#dashboard">
          <span class="nav-icon">📊</span> Dashboard
        </a>
        <a class="nav-item" data-view="projects" href="#projects">
          <span class="nav-icon">📁</span> Projects
        </a>
        <a class="nav-item" data-view="agents" href="#agents">
          <span class="nav-icon">🤖</span> Agent Log
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-status" id="sidebar-status">
          <span class="status-dot"></span> API connected
        </div>
        <div class="sidebar-hint">Powered by AI agents</div>
      </div>
    </aside>

    <main id="main-content">
      <!-- Content rendered dynamically by app.js -->
    </main>
  </div>

  <!-- Modal overlay -->
  <div id="modal-overlay" class="modal-overlay hidden" onclick="closeModal()">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h3 id="modal-title">Modal</h3>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <!-- Toast container -->
  <div id="toast-container"></div>

  <script src="/js/api.js"></script>
  <script src="/js/dashboard.js"></script>
  <script src="/js/projects.js"></script>
  <script src="/js/kanban.js"></script>
  <script src="/js/agents.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
